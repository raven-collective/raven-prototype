# Native Linux packages of the desktop app, each built inside its distro family's oldest
# supported release so it runs there and on anything newer:
#
#   .deb                Ubuntu 22.04 base: Debian 12+, Ubuntu 22.04+, Mint, Pop!_OS, ...
#   .rpm (fedora)       Fedora 44+
#   .rpm (el10)         RHEL 10, AlmaLinux 10, Rocky Linux 10 (needs EPEL and CRB for the tray)
#   .rpm (opensuse)     openSUSE Leap 16 and Tumbleweed
#   .pkg.tar.zst        Arch Linux and derivatives
#
# Every package is then installed on the releases it is meant for, and the binary is
# checked for libraries or glibc symbols that are missing there.
#
# The AppImage and the Windows installer are still built and signed by release.ps1.
# A pushed v* tag that matches the app's version publishes these packages on its GitHub
# release, creating the release if release.ps1 hasn't yet
# (infra/release/attach-to-github-release.sh). Running this workflow by hand on the tag
# with "attach to release" ticked does the same, for a run that failed. See
# docs/releasing.md.
name: Linux packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - ".github/workflows/linux-packages.yml"
      - "infra/release/linux/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/package.json"
      - "apps/desktop/bun.lock"
  pull_request:
    paths:
      - ".github/workflows/linux-packages.yml"
      - "infra/release/linux/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/package.json"
      - "apps/desktop/bun.lock"
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Attach the packages to the GitHub release of this tag (run on a v* tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The server a fresh install signs in to, as in release.ps1.
  VITE_RAVEN_API_URL: ${{ vars.RAVEN_API_URL || 'https://mimir.rvn.bluehour.cloud' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build ${{ matrix.name }}
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            image: ubuntu:22.04
            format: deb
          - name: fedora
            image: fedora:44
            format: rpm
            label: fedora
          - name: el10
            image: almalinux:10
            format: rpm
            label: el10
          - name: opensuse
            image: registry.opensuse.org/opensuse/leap:16.0
            format: rpm
            label: opensuse
          - name: arch
            image: archlinux:base-devel
            format: pacman
    steps:
      # Checkout and the cache need git, tar and zstd, which bare images lack.
      - name: Bootstrap
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git tar zstd
          elif command -v dnf >/dev/null; then
            dnf install -y git tar zstd
          elif command -v zypper >/dev/null; then
            zypper --non-interactive install --no-recommends git tar zstd
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed git tar zstd
          fi
      - uses: actions/checkout@v5
      - name: Install build dependencies and Rust
        run: |
          infra/release/linux/install-build-deps.sh
          # Not GITHUB_PATH: in a container whose image declares no PATH (openSUSE's),
          # that becomes the whole PATH and later steps can't find sh.
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
      # Downloaded crates, the Tauri CLI and compiled dependencies, one cache per distro,
      # keyed on Cargo.lock and the compiler; Raven's own crate is always rebuilt. Pull
      # requests read the cache but don't save to it, so they can't push out main's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build the package
        run: infra/release/linux/build-package.sh "${{ matrix.format }}" packages "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: packages/*
          if-no-files-found: error

  install:
    name: Install on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: debian, image: "debian:12" }
          - { package: debian, image: "debian:13" }
          - { package: debian, image: "ubuntu:22.04" }
          - { package: debian, image: "ubuntu:24.04" }
          - { package: fedora, image: "fedora:44" }
          - { package: el10, image: "almalinux:10" }
          - { package: el10, image: "rockylinux/rockylinux:10" }
          - { package: opensuse, image: "registry.opensuse.org/opensuse/leap:16.0" }
          - { package: opensuse, image: "registry.opensuse.org/opensuse/tumbleweed:latest" }
          - { package: arch, image: "archlinux:latest" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.package }}
          path: pkg
      - name: Install with the distro's package manager
        shell: sh
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./pkg/*.deb
          elif command -v dnf >/dev/null; then
            . /etc/os-release
            if [ "$ID" != fedora ]; then
              # The tray library is in EPEL and needs libdbusmenu from CRB, which
              # AlmaLinux's image enables and Rocky's does not.
              dnf install -y dnf-plugins-core epel-release
              dnf config-manager --set-enabled crb
            fi
            dnf install -y ./pkg/*.rpm
          elif command -v zypper >/dev/null; then
            zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.rpm
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm
            pacman -U --noconfirm ./pkg/*.pkg.tar.zst
          fi
      - name: Check the installed app
        shell: sh
        run: |
          set -eu
          binary=/usr/bin/raven-desktop
          test -x "$binary"
          ls /usr/share/applications/*.desktop
          ldd "$binary" > ldd.txt 2>&1 || { cat ldd.txt; exit 1; }
          if grep -E "not found" ldd.txt; then
            echo "The binary needs libraries or glibc symbols this release does not have." >&2
            exit 1
          fi
          echo "All $(wc -l < ldd.txt) shared libraries resolve."

  attach:
    name: Publish on the GitHub release
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.attach_to_release)
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            apps/desktop/src-tauri/tauri.conf.json
            docs/release-notes
            infra/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: infra/release/attach-to-github-release.sh SHA256SUMS-linux-packages "$RUNNER_TEMP/packages"
