# Serves Raven's desktop releases: latest.json (what the app checks) and the signed
# installers under one folder per version. release.ps1 writes the files; nothing here
# decides anything.
server {
    listen 80;
    server_name _;

    root /srv/releases;
    autoindex off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Upload staging folders and half-written manifests.
    location ~ /\. {
        return 404;
    }

    # The manifest must never be served stale, or a release would not be seen.
    location ~ /latest(\.previous)?\.json$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The download page names the live version, so it changes with every release too.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The web app (apps/desktop/web) under /app/: its page names the current build, so
    # it is never cached; the build's files below it have hashed names.
    location ~ ^/app/(index\.html)?$ {
        add_header Cache-Control "no-cache" always;
        try_files /app/index.html =404;
    }

    # A published version never changes, so its files can be cached for good.
    location / {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
